# Gavin Lake first-guess LTSY harvest target.
#
# Derivation: ws4/estimate_ltsy_target.py
#   THLB proxy (CONTCLAS=C): 4,662.96 ha
#   area-weighted mean yield CMAI: 3.599653 m3/ha/yr at age 100
#   LTSY annual: 16,785.06 m3/yr
#   10-year LTSY: 167,850.57 m3/period
#   x1.1 first guess: 184,635.63 m3/period, rounded to 185,000
#
# This is a first guess for a periodic harvest level, not an AAC
# determination. It replaces the literal 500,000 as the runnable target;
# the literal remains in ws4/targets_legacy_harvest.yaml as a parity
# reference and possible pull-up target.
#
# The growing-stock floor is the legacy scenario value. It is consistent
# with 90% of the measured initial growing stock (1,418,962.31 m3).
#
# The horizon is 30 ten-year periods (300 years).
targets:
  - account: product.yield.managed.total
    period: 1
    minimum: 185000
    period_width: 10
    min_weight: 1.0
    shape: linear
