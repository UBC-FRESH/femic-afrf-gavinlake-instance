# Legacy AFRF Gavin Lake harvest and flow targets.
#
# Translated from data/legacy_gavinlake/scripts/scenarios_AFRF_H.bsh:
#   product.yield.managed.total >= 500,000 m3 per 10-year period, periods 1-30
#   feature.yield.managed.total >= 1,277,067 m3 at period 30 (90% of the
#     measured initial growing stock, 1,418,962 m3)
#   product.flow.yield.even between -1 and 1, weight 1000, periods 1-30
#
# PROVENANCE WARNING: the 500,000 harvest floor is a copied MKRF legacy
# template value, not an AFRF-calibrated target. The AFRF package's build
# scripts still point at PW_MKRF, and the same literal appears in the MKRF
# Targets/01_harvest.bsh. Keep it here as a parity reference and stress test.
# The 1,277,067 growing-stock floor is calibrated: it is 90% of the measured
# initial growing stock. See notes/reference/legacy-target-provenance.md.
#
# The legacy pin defines patch.grpblk and patch.sepblk accounts, but the
# scenario scripts do not set patch share targets. ws4 reports the patch
# accounts through ws4/patch_accounts.yaml and does not constrain them here.
#
# The horizon is 30 ten-year periods (300 years), matching Horizon.setHorizon(30, 10).
targets:
  - account: product.yield.managed.total
    period: 1
    minimum: 500000
    period_width: 10
    min_weight: 1.0
